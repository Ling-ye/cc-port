[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-port"
version = "0.5.3"
description = "CC Port: multi-platform registry, publisher and installer for AI coding agent resources (skills, MCP servers, rules, prompts and plugins)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lingye" }]
keywords = ["cursor", "skills", "mcp", "agent", "registry", "lingye"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "PyGithub>=2.3",
    "python-frontmatter>=1.1",
    "fastmcp>=0.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.5",
]
# Tooling needed only when building the Tauri desktop app from source.
# Installs PyInstaller for the release-only desktop API sidecar and Pillow
# for generating placeholder icons via tools/packaging/icons/generate_icons.py.
desktop = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
]

[project.scripts]
cc-port = "cc_port.interfaces.cli:app"
cc-port-mcp = "cc_port.interfaces.mcp_server:main"
cc-port-desktop-api = "cc_port.interfaces.desktop_api:main"

[project.urls]
Homepage = "https://github.com/Ling-ye/cc-port"
Issues = "https://github.com/Ling-ye/cc-port/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cc_port*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Typer relies on `typer.Argument(...)` / `typer.Option(...)` in defaults.
ignore = ["E501", "B008"]
