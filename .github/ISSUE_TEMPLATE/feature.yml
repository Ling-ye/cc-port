name: Feature request
description: 提议一个明确的用户问题或改进
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么情况下遇到什么问题？不要只描述希望增加的按钮或技术方案。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前做法
      description: 现在如何处理？成本或风险是什么？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察的成功结果。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如有具体设计，请说明接口、数据流、失败模式和兼容性。
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已经尝试或考虑过哪些方式？
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 桌面 GUI
        - CLI
        - MCP Server
        - Registry 或同步格式
        - 新平台
        - 文档
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 如果方向确认，我愿意提交 Pull Request。
