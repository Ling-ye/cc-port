# CC Port configuration file.
# Copy this to ~/.config/cc-port/config.toml and fill in your values.
# On Windows it lives at %USERPROFILE%\.config\cc-port\config.toml.

[github]
# Optional GitHub API token for CLI/MCP publishing and repository management.
# CC_PORT_GITHUB_TOKEN may be used instead and takes precedence.
# The desktop app neither reads nor writes this field for repository binding.
token = ""

# User or organization under which CLI/MCP repository creation occurs.
owner = ""

# Optional prefix prepended to every newly created repo, e.g.
# "cc-port-" produces github.com/<owner>/cc-port-<name>.
repo_prefix = "cc-port-"

# Default visibility for newly created repositories.
default_private = true

[git]
# Optional absolute path or command name. Leave empty to search PATH and
# standard installation locations.
executable = ""

[install]
# Fallback directory used when no platform-specific skills_dir is configured.
target = "~/.cursor/skills"

[resources]
# Private data repository for your selected resources.  You can choose any
# repo name; if local_path is empty, CC Port uses ~/<repo_name>.
repo_name = "cc-port-resources"
repo_url = ""
local_path = ""
branch = "main"
# native uses GCM/SSH and never injects the GitHub API token into Git.
# Existing configs may retain auto (legacy token-first) or token.
credential_mode = "native"

[state]
# Wait time when another CC Port process is writing the same target.
lock_timeout_seconds = 10

# Local operation and backup cleanup defaults. Cleanup is never automatic.
retention_days = 90
keep_latest_operations = 20
max_backup_mb = 2048

# ---- Platform configuration ----
# New configurations enable every complete writable preset. CC Port may create
# these directories during sync even when the corresponding tool is absent.
# File-style Prompt targets use prompts_dir/<install-name>.md. If prompts_dir is
# empty, custom platforms retain the legacy rules_dir/<install-name> behavior.

[platforms.codex]
enabled = true
skills_dir = "~/.codex/skills"
mcp_json = ""
rules_dir = ""
prompts_dir = ""
plugins_dir = "~/.codex/plugins"

[platforms.claude-code]
enabled = true
skills_dir = "~/.claude/skills"
mcp_json = "~/.claude.json"
rules_dir = ""
prompts_dir = ""
plugins_dir = "~/.claude/plugins"

[platforms.cursor]
enabled = true
skills_dir = "~/.cursor/skills"
mcp_json = "~/.cursor/mcp.json"
rules_dir = ""
prompts_dir = "~/.cursor/commands"
plugins_dir = ""

[platforms.windsurf]
enabled = true
skills_dir = "~/.windsurf/skills"
mcp_json = "~/.windsurf/mcp.json"
rules_dir = ""
prompts_dir = ""
plugins_dir = ""

[platforms.opencode]
enabled = true
skills_dir = "~/.config/opencode/skills"
mcp_json = "~/.config/opencode/opencode.json"
rules_dir = "~/.config/opencode/rules"
prompts_dir = ""
plugins_dir = "~/.config/opencode/plugins"
