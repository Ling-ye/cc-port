# LingyePluginMarketplace configuration file.
# Copy this to ~/.config/lpm/config.toml and fill in your values.
# On Windows it lives at %USERPROFILE%\.config\lpm\config.toml.

[github]
# The desktop OAuth device flow stores its token here in plaintext after
# authorization. LPM_GITHUB_TOKEN may be used instead and takes precedence.
token = ""

# Required user or organization under which new repositories are created.
# Personal owners must match the authorized account. The desktop app never
# fills this value automatically.
owner = ""

# Optional prefix prepended to every newly created repo, e.g.
# "lpm-" produces github.com/<owner>/lpm-<name>.
repo_prefix = "lpm-"

# Default visibility for newly created repositories.
default_private = true

[git]
# Optional absolute path or command name. Leave empty to search PATH and
# standard installation locations.
executable = ""

[install]
# Fallback directory used when no platform-specific skills_dir is configured.
target = "~/.cursor/skills"

[resources]
# Private data repository for your selected resources.  You can choose any
# repo name; if local_path is empty, LPM uses ~/<repo_name>.
repo_name = "LingyeAIResources"
repo_url = ""
local_path = ""
branch = "main"
# native uses GCM/SSH and never injects the GitHub API token into Git.
# Existing configs may retain auto (legacy token-first) or token.
credential_mode = "native"

[state]
# Wait time when another LPM process is writing the same target.
lock_timeout_seconds = 10

# Local operation and backup cleanup defaults. Cleanup is never automatic.
retention_days = 90
keep_latest_operations = 20
max_backup_mb = 2048

# ---- Platform configuration ----
# New configurations enable every complete writable preset. LPM may create
# these directories during sync even when the corresponding tool is absent.

[platforms.codex]
enabled = true
skills_dir = "~/.codex/skills"
mcp_json = ""
rules_dir = ""
plugins_dir = "~/.codex/plugins"

[platforms.claude-code]
enabled = true
skills_dir = "~/.claude/skills"
mcp_json = "~/.claude.json"
rules_dir = ""
plugins_dir = "~/.claude/plugins"

[platforms.cursor]
enabled = true
skills_dir = "~/.cursor/skills"
mcp_json = "~/.cursor/mcp.json"
rules_dir = ""
plugins_dir = ""

[platforms.windsurf]
enabled = true
skills_dir = "~/.windsurf/skills"
mcp_json = "~/.windsurf/mcp.json"
rules_dir = ""
plugins_dir = ""

[platforms.opencode]
enabled = true
skills_dir = "~/.config/opencode/skills"
mcp_json = "~/.config/opencode/opencode.json"
rules_dir = "~/.config/opencode/rules"
plugins_dir = "~/.config/opencode/plugins"
